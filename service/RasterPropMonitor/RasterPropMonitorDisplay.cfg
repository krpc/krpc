// Adds a page named krpc to every Raster Prop Monitor screen, which shows the screen's own
// kRPC display (RasterPropMonitor.Monitor.Display). The page has no button, so a script
// switches to it. Delete this file to leave the screens as they are.
@PROP[*]:HAS[@MODULE[RasterPropMonitor]]:NEEDS[RasterPropMonitor]
{
    @MODULE[RasterPropMonitor],*
    {
        PAGE
        {
            name = krpc
            PAGEHANDLER
            {
                name = KRPCDisplay
                method = Text
                buttonClickMethod = ButtonClick
                buttonReleaseMethod = ButtonRelease
                pageActiveMethod = PageActive
            }
            BACKGROUNDHANDLER
            {
                name = KRPCDisplay
                method = RenderBackground
            }
        }
    }
}
