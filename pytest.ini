[pytest]
# The kRPC integration tests live under service/*/test, and those of the documentation examples
# under doc/test. They are run with pytest from the repository root (with the krpctools.game
# pytest plugin, which orders them by their required mods and adds the options that choose the
# game). importlib mode is required because several test files share a basename across
# services (e.g. test_control.py) and the directories are not packages.
testpaths = service/*/test doc/test
addopts = --import-mode=importlib

# The documentation examples (doc/test) are marked example, with their language, and slow for
# a long flight, so a run can select them with -m
markers =
    example: a documentation example run in game
    slow: an example that flies for several minutes
    python: a Python example
    csharp: a C# example
    cpp: a C++ example
    cnano: a C-nano example
    java: a Java example
    lua: a Lua example
    js: a JavaScript example

# Put the repository root on sys.path so test modules can import shared helpers from
# their own directory by fully-qualified name (e.g.
# service.SpaceCenter.test.resources_equivalence) via implicit namespace packages.
# Fully-qualified imports keep the colliding-basename problem away.
pythonpath = .

# Stream the framework's progress messages (game loading, mod set in use) live to the
# console. Only the krpctools.game logger emits at INFO in this codebase, so this stays quiet.
log_cli = true
log_cli_level = INFO
log_cli_format = %(name)s: %(message)s
