// Test-only parts for the SpaceCenter KerbalActuators tests. KerbalActuators ships no parts.
//
// Two clones of the Juno with a WBIPropSpinner, one that can reverse thrust and one that cannot.
// The Juno has one thrust transform, which serves as both the forward and the reverse one. The
// part names have no underscores, so KSP keeps them verbatim (kerbalActuatorsReverserTest),
// matching the presence check in krpctools/game/ksp/mods/__init__.py.

+PART[miniJetEngine]:NEEDS[KerbalActuators]
{
    @name = kerbalActuatorsReverserTest
    @title = kRPC KerbalActuators Reverser Test Engine
    @TechRequired = start
    @entryCost = 0
    @cost = 0

    MODULE
    {
        name = WBIPropSpinner
        thrustTransform = thrustTransform
        reverseThrustTransform = thrustTransform
        canReverseThrust = true
    }
}

+PART[miniJetEngine]:NEEDS[KerbalActuators]
{
    @name = kerbalActuatorsFixedTest
    @title = kRPC KerbalActuators Fixed Test Engine
    @TechRequired = start
    @entryCost = 0
    @cost = 0

    MODULE
    {
        name = WBIPropSpinner
        thrustTransform = thrustTransform
        reverseThrustTransform = thrustTransform
        canReverseThrust = false
    }
}
