// Test-only part for the SpaceCenter B9PartSwitch tests. B9PartSwitch ships no parts.
//
// A clone of the FL-T400 whose tank B9PartSwitch switches between three subtypes, each with
// its own resources and dry mass. The part name has no underscores, so KSP keeps it verbatim
// (b9PartSwitchTest), matching the presence check in krpctools/game/ksp/mods/__init__.py.

+PART[fuelTank]:NEEDS[B9PartSwitch]
{
    @name = b9PartSwitchTest
    @title = kRPC B9PartSwitch Test Tank
    @TechRequired = start
    @entryCost = 0
    @mass = 0.1

    !RESOURCE,* {}

    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = fuelSwitch
        baseVolume = 400

        // Tank mass 0.05 t, 180 LiquidFuel and 220 Oxidizer
        SUBTYPE
        {
            name = LFO
            tankType = LFO
        }

        // Tank mass 0.16 t, 600 MonoPropellant
        SUBTYPE
        {
            name = MonoPropellant
            tankType = MonoPropellant
        }

        // No resources, 0.5 t added
        SUBTYPE
        {
            name = Structural
            addedMass = 0.5
        }
    }
}
