// Adds a page to every Raster Prop Monitor screen that shows the vessel's display named
// test, so the Raster Prop Monitor tests can show one display on several screens.
@PROP[*]:HAS[@MODULE[RasterPropMonitor]]:NEEDS[RasterPropMonitor]
{
    @MODULE[RasterPropMonitor],*
    {
        PAGE
        {
            name = krpctest
            PAGEHANDLER
            {
                name = KRPCDisplay
                method = Text
                display = test
                buttonClickMethod = ButtonClick
                buttonReleaseMethod = ButtonRelease
                pageActiveMethod = PageActive
            }
            BACKGROUNDHANDLER
            {
                name = KRPCDisplay
                method = RenderBackground
                display = test
            }
        }
    }
}
