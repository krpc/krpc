// Renames the star of Kopernicus' stock system Kerbol, as in a planet pack whose star is not
// the Sun. The other bodies name the star by its identifier, Squad/Sun, which is kept. Real Solar
// System brings its own system.
@Kopernicus:NEEDS[!RealSolarSystem]
{
    @Body[Sun]
    {
        @name = Kerbol
    }
}
