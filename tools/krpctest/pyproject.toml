[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krpctest"
dynamic = ["version"]
authors = [
    {name = "djungelorm", email = "djungelorm@users.noreply.github.com"},
]
description = "Utilities for running service tests for kRPC."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["krpc >= 0.4", "pytest >= 7"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
]

[project.scripts]
krpc-game = "krpctest.cli:main"

[project.urls]
Homepage = "https://krpc.github.io/krpc"

[tool.hatch.version]
path = "krpctest/version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["krpctest"]
