# The third-party dependencies of the repository, and every place that pins each one.
#
#   python3 tools/deps/deps.py check      # each pin agrees with this file (//tools/deps:test)
#   python3 tools/deps/deps.py outdated   # newer releases upstream
#   python3 tools/deps/deps.py update --all
#
# Each [[dep]] starts with name then version, which update rewrites in place.
#
#   version  The pinned version. Every location renders from it.
#   source   Where releases are listed, as kind:id. Kinds: bcr, pypi, npm, nuget, maven,
#            github-release, github-tag, node, dotnet-sdk, lua, docker, and regex:URL,
#            which takes every match of tag in the page at URL. {dep:NAME} in a source
#            is the version of another entry.
#   tag      For github, docker and regex sources, a regex whose first group is the
#            version. _ and - in the group become dots.
#   below    Releases at or above this version are not taken, such as a new major.
#   verify   Other sources that must list a release before it is taken, as
#            { source, version }, the version a template.
#   hold     Why update --all skips the entry. Naming it on the command line updates it.
#   note     Printed on update, for a step the tool does not do.
#   regen    The lock files to regenerate after an update: pip, nuget, maven, pnpm.
#   at       The locations, each "file: text", or a table with file and text and optionally
#            sha256 = true (the text is a URL, whose download hash replaces the sha256 of
#            the Bazel rule or CMake FetchContent_Declare holding it), strict = false
#            (see below) or generated = true (a regenerator writes the file, so update
#            leaves it to that). A file with a * is a glob.
#
# A text is a template. {version} is the version, {version:_} joins its parts with _, and
# {major}, {minor}, {patch} and {major_minor} are its leading parts. check tests that each
# location holds its text, and, unless strict = false, that every occurrence of the text
# before its first placeholder continues with the rendered text. That catches a pin that
# drifted in one of several places. A placeholder at either end of a text matches a whole
# version, so 1.2 does not match 1.2.3. A text with no placeholder pins a fixed download,
# such as a commit, which update leaves alone.
#
# check also scans the repository for pins that no location covers, in the forms listed in
# PIN_FORMS in deps.py, and for a download hash with no sha256 location. Every dependency
# needs an entry here.

