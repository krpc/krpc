# ----------------------- Build environment image ----------------------------------------
#
# A change to the Dockerfile needs a new image, at the next version. Build and push it with
# make build deploy VERSION=<version> in tools/buildenv, then point CI at it with:
# deps.py update buildenv --to <version>

[[dep]]
name = "bazelisk"
version = "1.30.0"
source = "github-release:bazelbuild/bazelisk"
hold = "needs a new buildenv image"
at = ["tools/buildenv/Dockerfile: bazelisk/releases/download/v{version}/"]

[[dep]]
name = "ubuntu"
version = "24.04"
source = "docker:library/ubuntu"
tag = '(\d+\.04)'
hold = "needs a new buildenv image"
at = ["tools/buildenv/Dockerfile: FROM ubuntu:{version}"]

[[dep]]
name = "buildenv"
version = "3.17.0"
hold = "set after pushing a new image"
at = [".github/**/*.yml: ghcr.io/krpc/buildenv:{version}"]
