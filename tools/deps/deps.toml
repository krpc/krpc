# ----------------------- Protobuf -------------------------------------------------------

# protoc and the runtime of each language, whose versions share the minor and patch
[[dep]]
name = "protobuf"
version = "36.2"
source = "github-release:protocolbuffers/protobuf"
verify = [
  { source = "bcr:protobuf", version = "{version}" },
  { source = "maven:com.google.protobuf:protobuf-java", version = "4.{version}" },
  { source = "pypi:protobuf", version = "7.{version}" },
  { source = "nuget:Google.Protobuf", version = "3.{version}" },
]
note = "System.Memory and System.Runtime.CompilerServices.Unsafe follow Google.Protobuf; check names their new versions"
regen = ["pip", "maven", "nuget"]
at = [
  'MODULE.bazel: bazel_dep(name = "protobuf", version = "{version}")',
  { file = "MODULE.bazel", text = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-linux-x86_32.zip", sha256 = true, strict = false },
  { file = "MODULE.bazel", text = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-linux-x86_64.zip", sha256 = true, strict = false },
  { file = "MODULE.bazel", text = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-osx-x86_64.zip", sha256 = true, strict = false },
  { file = "MODULE.bazel", text = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-win32.zip", sha256 = true, strict = false },
  "MODULE.bazel: com.google.protobuf:protobuf-java:4.{version}",
  "MODULE.bazel: com.google.protobuf:protobuf-java-util:4.{version}",
  "tools/build/python/requirements.in: protobuf==7.{version}",
  'client/python/pyproject.toml: "protobuf >= 7.{version}"',
  "tools/build/dotnet/paket.dependencies: nuget Google.Protobuf 3.{version}",
  'experimental/ksa/BUILD.bazel: protobuf_version = "3.{version}"',
  { file = "tools/build/dotnet/paket.main.bzl", text = '{"name": "Google.Protobuf", "id": "Google.Protobuf", "version": "3.{version}"', generated = true },
  'MODULE.bazel: "nuget.google.protobuf.v3.{version}"',
  "tools/build/dotnet/BUILD.bazel: @nuget.google.protobuf.v3.{version}//",
  'tools/build/dotnet/BUILD.bazel:     version = "3.{version}"',
  'client/csharp/BUILD.bazel: "Google.Protobuf": "3.{version}"',
  'client/csharp/src/KRPC.Client.csproj: <PackageReference Include="Google.Protobuf" Version="3.{version}"',
  'client/csharp/test/KRPC.Client.Test.csproj: <PackageReference Include="Google.Protobuf" Version="3.{version}"',
  'core/src/KRPC.Core.csproj: <PackageReference Include="Google.Protobuf" Version="3.{version}"',
  "client/*/CMakeLists.txt.tmpl: GIT_TAG        v{version}",
]

