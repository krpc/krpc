# ----------------------- Toolchains -----------------------------------------------------

# The SDK rules_dotnet builds its apphost with, which it always downloads, so the build
# downloads one SDK
[[dep]]
name = "dotnet-sdk"
version = "10.0.201"
source = "regex:https://raw.githubusercontent.com/bazel-contrib/rules_dotnet/v{dep:rules_dotnet}/MODULE.bazel"
tag = 'dotnet_version = "(\d+\.\d+\.\d+)"'
at = ['MODULE.bazel: dotnet.toolchain(dotnet_version = "{version}")']

[[dep]]
name = "node"
version = "22.23.5"
source = "node"
below = "23"
at = ['MODULE.bazel: node.toolchain(node_version = "{version}")']

# The oldest Node.js the JavaScript client supports
[[dep]]
name = "node-floor"
version = "22"
hold = "the oldest supported Node.js"
at = ['client/js/package.json: "node": ">={version}"']

# The minor version, here and in the hermetic toolchain. A new major is a new buildenv
# image, as its apt packages carry the major.
[[dep]]
name = "llvm"
version = "23.1.5"
source = "github-release:llvm/llvm-project"
tag = 'llvmorg-(\d+\.\d+\.\d+)'
below = "24"
verify = [{ source = "pypi:clang-format", version = "{version}" }]
at = [
  'MODULE.bazel: llvm_version = "{version}"',
  { file = "MODULE.bazel", text = "https://files.pythonhosted.org/packages/py2.py3/c/clang-format/clang_format-{version}-py2.py3-none-win_amd64.whl", sha256 = true },
  'MODULE.bazel: path = "/usr/lib/llvm-{major}"',
  "tools/build/llvm/clang-format-system.sh: /usr/lib/llvm-{major}/",
  "tools/build/llvm/clang-tidy-system.sh: /usr/lib/llvm-{major}/",
  "tools/buildenv/Dockerfile: llvm-toolchain-noble-{major} main",
  { file = "tools/buildenv/Dockerfile", text = "clang-{major} clangd-{major} clang-tidy-{major} clang-format-{major} lld-{major} llvm-{major} ", strict = false },
]

# The Bazel toolchain. rules_python sets the patch release. The pypi sources skip the
# releases that need a later Python.
[[dep]]
name = "python"
version = "3.12"
hold = "a new toolchain is a change of its own"
at = [
  'MODULE.bazel: python_version = "{version}"',
  'BUILD.bazel: python_version = "{version}"',
  'doc/BUILD.bazel: python_version = "{version}"',
  'tools/build/BUILD.bazel: python_version = "{version}"',
  'tools/build/dotnet/BUILD.bazel: python_version = "{version}"',
  'tools/build/protobuf/BUILD.bazel: python_version = "{version}"',
  'tools/build/python/BUILD.bazel: python_version = "{version}"',
  'tools/ci/BUILD.bazel: python_version = "{version}"',
  'tools/deps/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/doc/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/doc/test/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/tools/release/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/server/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/service/KSA/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/service/KFS/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/tools/game/BUILD.bazel: python_version = "{version}"',
  'experimental/ksa/tools/grpc/BUILD.bazel: python_version = "{version}"',
]

