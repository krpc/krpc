inputs:
  bazel:
    description: The command that runs Bazel
    default: bazel
  config:
    description: The CI config in .bazelrc
    default: ci-linux
runs:
  using: composite
  steps:
    # The protoc of the KSP build has no Apple silicon release
    - name: rosetta
      if: runner.os == 'macOS'
      shell: bash
      run: sudo softwareupdate --install-rosetta --agree-to-license
    - name: get-bazel-version
      shell: bash
      run: |
        # Turn on the CI config for every later bazel command in the job
        echo "common --config=${{ inputs.config }}" >> ~/.bazelrc
        echo "BAZEL_VERSION=$(cat .bazelversion)" >> "$GITHUB_ENV"
        # The Linux default, which macOS would otherwise keep under ~/Library
        echo "BAZELISK_HOME=$HOME/.cache/bazelisk" >> "$GITHUB_ENV"
    # Bazelisk downloads Bazel itself on the first bazel command in a job
    - name: restore-bazelisk
      id: bazelisk-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/bazelisk
        key: bazelisk-${{ runner.os }}-${{ env.BAZEL_VERSION }}
    - name: get-bazel-info
      shell: bash
      run: |
        # Cache only the download archives, in the content_addressable subdir of the
        # repository cache. Bazel 9 also keeps a "repo contents cache" of extracted
        # repositories in a sibling contents/ dir, which must stay out of the GitHub
        # cache. Linux uses a system LLVM, so only the macOS cache holds an LLVM
        # archive.
        echo "BAZEL_DOWNLOAD_CACHE=$(${{ inputs.bazel }} info repository_cache)/content_addressable" >> "$GITHUB_ENV"
    - name: save-bazelisk
      if: steps.bazelisk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/bazelisk
        key: bazelisk-${{ runner.os }}-${{ env.BAZEL_VERSION }}
    # A change to the dependencies restores the newest cache for this Bazel
    # version, so the fetch downloads only the archives that changed
    - name: restore-bazel-cache
      id: bazel-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.BAZEL_DOWNLOAD_CACHE }}
        key: bazel-repo-cache-${{ runner.os }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'tools/build/python/requirements_lock.txt') }}
        restore-keys: bazel-repo-cache-${{ runner.os }}-${{ env.BAZEL_VERSION }}-
    - name: bazel-fetch
      if: steps.bazel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        touch "$RUNNER_TEMP/bazel-fetch-start"
        ${{ inputs.bazel }} fetch //...
        # Bazel updates the mtime of each archive it reads from the cache, so an
        # archive older than the fetch is one the dependencies no longer use. We
        # remove its directory, which also holds the archive's id files.
        find "$BAZEL_DOWNLOAD_CACHE" -type f -name file ! -newer "$RUNNER_TEMP/bazel-fetch-start" |
          while read -r archive; do
            echo "pruning $archive"
            rm -rf "$(dirname "$archive")"
          done
    - name: save-bazel-cache
      if: steps.bazel-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.BAZEL_DOWNLOAD_CACHE }}
        key: bazel-repo-cache-${{ runner.os }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'tools/build/python/requirements_lock.txt') }}
