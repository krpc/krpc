inputs:
  packages:
    required: true
# vcpkg names each archive in its binary cache after the ABI hash of the
# package it holds, and rebuilds any package whose archive is missing. The ABI
# hashes cover tools the runner image ships, such as CMake and PowerShell. So
# we restore the newest cache built on this runner image, or failing that the
# newest for these packages, and key the saved cache on the image and the ABI
# hashes the install used. A gradual image rollout then keeps a cache for each
# image, and an image update that leaves the hashes alone rebuilds nothing.
runs:
  using: composite
  steps:
    - name: cache-prefix
      id: cache-prefix
      shell: pwsh
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        $prefix = 'vcpkg-windows-' + ($env:PACKAGES -replace '[^A-Za-z0-9]+', '-') + '-'
        echo "prefix=$prefix" >> $env:GITHUB_OUTPUT
        echo "image-prefix=$prefix$env:ImageOS-$env:ImageVersion-" >> $env:GITHUB_OUTPUT
    - name: restore-vcpkg
      id: restore-vcpkg
      uses: actions/cache/restore@v6
      with:
        path: C:\vcpkg-binary-cache
        key: ${{ steps.cache-prefix.outputs.image-prefix }}${{ github.run_id }}
        restore-keys: |
          ${{ steps.cache-prefix.outputs.image-prefix }}
          ${{ steps.cache-prefix.outputs.prefix }}
    - name: install-deps
      shell: pwsh
      env:
        VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache
      run: |
        New-Item -ItemType Directory -Force -Path C:\vcpkg-binary-cache | Out-Null
        vcpkg install ${{ inputs.packages }}
    # A package's ABI hash is the hash of its vcpkg_abi_info.txt, which lists
    # the inputs. Comparing it between two runs shows why a package rebuilt.
    - name: cache-key
      id: cache-key
      shell: pwsh
      env:
        PREFIX: ${{ steps.cache-prefix.outputs.image-prefix }}
      run: |
        $abis = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\*\share\*\vcpkg_abi_info.txt" |
          ForEach-Object {
            $abi = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            Write-Host "::group::$($_.Directory.Name):$($_.Directory.Parent.Parent.Name) $abi"
            Get-Content $_ | Write-Host
            Write-Host '::endgroup::'
            $abi
          } |
          Sort-Object -Unique
        # Drop the archives of packages the install no longer uses
        Get-ChildItem C:\vcpkg-binary-cache -Recurse -Filter *.zip |
          Where-Object { $abis -notcontains $_.BaseName } |
          ForEach-Object { Write-Host "pruning $($_.Name)"; Remove-Item $_.FullName }
        $hash = [BitConverter]::ToString(
          [Security.Cryptography.SHA256]::Create().ComputeHash(
            [Text.Encoding]::UTF8.GetBytes($abis -join "`n"))).Replace('-', '').ToLower()
        Write-Host "cache key: $env:PREFIX$hash"
        echo "key=$env:PREFIX$hash" >> $env:GITHUB_OUTPUT
    # Saved here rather than at the end of the job, which installs the kRPC
    # package into the same directory
    - name: save-vcpkg
      if: steps.cache-key.outputs.key != steps.restore-vcpkg.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: C:\vcpkg-binary-cache
        key: ${{ steps.cache-key.outputs.key }}
