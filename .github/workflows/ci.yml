      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: test
        run: |
          bazel test \
            //tools/benchmarks:test \
            //tools/krpctest:test \
            //tools/krpctools:test

  # One job per thing built or tested, mirroring the Linux jobs above. Windows
  # has no equivalent of the ones whose every target needs a POSIX tool -- the
  # lua client, the serial transport, the pdf documentation -- because there
  # would be nothing left in them to run.
  windows-build-krpc:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bazelisk
        run: npm install -g @bazel/bazelisk
      - name: setup
        uses: ./.github/actions/bazel-fetch-windows
      - name: build
        shell: bash
        run: |
          bazelisk build --config=windows \
            //:krpc \
            //:csproj \
            //tools/krpctools \
            //tools/TestServer:archive

  windows-build-csharp-sln:
    needs: linux-build-genfiles
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bazelisk
        run: npm install -g @bazel/bazelisk
      - name: setup
        uses: ./.github/actions/bazel-fetch-windows
      - name: download-genfiles
        uses: actions/download-artifact@v8
        with:
          name: genfiles
      # Git Bash carries no unzip, so unpack with what Windows does have.
      - name: extract-genfiles
        shell: pwsh
        run: |
          Get-ChildItem krpc-genfiles-*.zip | ForEach-Object {
            Expand-Archive -Path $_ -DestinationPath . -Force
          }
          Remove-Item krpc-genfiles-*.zip
      - name: build
        shell: bash
        run: |
          dotnet build KRPC.sln -c Debug -warnaserror
          dotnet build KRPC.sln -c Release -warnaserror
      - name: test
        shell: bash
        run: bazelisk test //:csproj-test --config=windows

