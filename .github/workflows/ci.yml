name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One group per pull request, so a new push cancels the runs its commit
# superseded. Pushes and manual runs have no head ref and fall back to the run
# id, giving each a group of its own that nothing else can cancel or queue
# behind.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every job below caps its runtime at half an hour. The longest takes eight
# minutes warm and roughly twice that when a cache miss makes it fetch its
# dependencies first, so the cap only ever fires on a hang, in place of the
# six hours a job would otherwise sit on a runner.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: bazel
        run: buildifier -mode check -lint warn -r .

  # One entry per thing built or tested. `build` and `test` hold Bazel target
  # patterns and either may be left out; `artifact` and `path` upload the
  # result. The jobs further down stay out of the matrix because they produce
  # more than one artifact, run something other than Bazel, or are named by
  # another job's `needs`, which cannot address a single entry of a matrix.
  linux:
    name: linux-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-docs-html
            build: //doc:html
            artifact: docs-html
            path: bazel-bin/doc/html.zip
          - name: build-docs-pdf
            build: //doc:pdf
            artifact: docs-pdf
            path: bazel-bin/doc/krpc-*.pdf
          - name: build-docs-examples
            build: //doc:compile-scripts
          - name: build-benchmarks
            build: //tools/benchmarks/...
          - name: test-docs
            test: //doc:test
          - name: test-core
            test: //core:test
          - name: test-service
            test: //service/...
          - name: test-client-csharp
            build: //client/csharp
            test: //client/csharp:test
            artifact: client-csharp-nupkg
            path: bazel-bin/client/csharp/KRPC.Client.*.nupkg
          - name: test-client-java
            build: //client/java:java
            test: //client/java:test
            artifact: client-java
            path: bazel-bin/client/java/krpc-java-*.jar
          - name: test-client-python
            build: //client/python:python
            test: //client/python:test
            artifact: client-python
            path: bazel-bin/client/python/krpc-python-*.tar.gz
          - name: test-client-lua
            build: //client/lua:lua //tools/build/lua:luasocket-unix-windows-rockspec
            test: //client/lua:test
            artifact: client-lua
            path: bazel-bin/client/lua/krpc-lua-*.zip
          - name: test-client-serialio
            test: //client/serialio:test
          - name: test-client-websockets
            test: //client/websockets:test
          - name: test-tools
            test: //tools/benchmarks:test //tools/krpctest:test //tools/krpctools:test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: build
        if: matrix.build
        run: bazel build ${{ matrix.build }}
      - name: test
        if: matrix.test
        run: bazel test ${{ matrix.test }}
      - name: upload-artifact
        if: matrix.artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  # The Linux matrix above, for Windows. Windows has no equivalent of the
  # entries whose every target needs a POSIX tool -- the serial transport, the
  # pdf documentation -- because there would be nothing left in them to run.
  # Nothing here uploads an artifact: the releases are built on Linux.
  windows:
    name: windows-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-krpc
            build: //:krpc //:csproj //tools/krpctools //tools/TestServer:archive
          - name: build-docs-examples
            build: //doc:compile-scripts
          - name: build-benchmarks
            build: //tools/benchmarks/...
          - name: test-core
            test: //core:test
          - name: test-service
            test: //service/...
          - name: test-client-cnano
            build: //client/cnano:cnano
            test: //client/cnano:test
          - name: test-client-cpp
            build: //client/cpp:cpp
            test: //client/cpp:test
          - name: test-client-csharp
            build: //client/csharp
            test: //client/csharp:test
          - name: test-client-java
            build: //client/java:java
            test: //client/java:test
          - name: test-client-python
            build: //client/python:python
            test: //client/python:test
          - name: test-client-lua
            build: //client/lua:lua
            test: //client/lua:test
          - name: test-client-websockets
            test: //client/websockets:test
          - name: test-tools
            test: //tools/benchmarks:test //tools/krpctest:test //tools/krpctools:test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/bazel-fetch-windows
      - name: build
        if: matrix.build
        shell: bash
        run: bazelisk build --config=windows ${{ matrix.build }}
      - name: test
        if: matrix.test
        shell: bash
        run: bazelisk test --config=windows ${{ matrix.test }}

  linux-build-krpc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: build
        run: |
          bazel build \
            //:krpc \
            //:csproj \
            //tools/krpctools \
            //tools/TestServer:archive
      - name: upload-krpc-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: krpc
          path: bazel-bin/krpc-*.zip
      - name: upload-krpctools-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: krpctools
          path: bazel-bin/tools/krpctools/krpctools-*.tar.gz
      - name: upload-testserver-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: testserver
          path: bazel-bin/tools/TestServer/TestServer-*.zip

  linux-build-genfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: build
        run: tools/release/genfiles.py
      - name: upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: genfiles
          path: bazel-bin/krpc-genfiles-*.zip

  linux-build-csharp-sln:
    needs: linux-build-genfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: download-genfiles
        uses: actions/download-artifact@v8
        with:
          name: genfiles
      - name: extract-genfiles
        run: |
          unzip krpc-genfiles-*.zip -d ./
          rm krpc-genfiles-*.zip
      - name: build
        run: |
          dotnet build KRPC.sln -c Debug -warnaserror
          dotnet build KRPC.sln -c Release -warnaserror
      - name: test
        run: bazel test //:csproj-test

  windows-build-csharp-sln:
    needs: linux-build-genfiles
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/bazel-fetch-windows
      - name: download-genfiles
        uses: actions/download-artifact@v8
        with:
          name: genfiles
      # Git Bash carries no unzip, so unpack with what Windows does have.
      - name: extract-genfiles
        shell: pwsh
        run: |
          Get-ChildItem krpc-genfiles-*.zip | ForEach-Object {
            Expand-Archive -Path $_ -DestinationPath . -Force
          }
          Remove-Item krpc-genfiles-*.zip
      - name: build
        shell: bash
        run: |
          dotnet build KRPC.sln -c Debug -warnaserror
          dotnet build KRPC.sln -c Release -warnaserror
      - name: test
        shell: bash
        run: bazelisk test //:csproj-test --config=windows

  linux-test-client-cnano:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: build
        run: bazel build //client/cnano:cnano
      - name: test
        run: bazel test //client/cnano:test
      - name: upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: client-cnano
          path: bazel-bin/client/cnano/krpc-cnano-*.zip

  linux-build-client-cnano-cmake:
    needs: linux-test-client-cnano
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cnano
      - name: cache-key
        id: cache-key
        run: |
          tmpl=$(sha256sum client/cnano/CMakeLists.txt.tmpl | cut -d' ' -f1)
          cc=$(cc --version 2>/dev/null | head -n1 || echo unknown-cc)
          info=$(printf '%s\n' ccache cnano "$cc" "$tmpl")
          echo 'cache key inputs:'
          printf '%s\n' "$info" | sed 's/^/  /'
          hash=$(printf '%s' "$info" | sha256sum | cut -d' ' -f1)
          echo "cache key: ccache-$hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: ccache-restore
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ steps.cache-key.outputs.hash }}
      - name: build-system-serialio
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip system-serialio
      - name: build-system-tcpip
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip system-tcpip
      - name: build-system-localsocket
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip system-localsocket
      - name: build-fetch-serialio
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip fetch-serialio
      - name: build-fetch-tcpip
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip fetch-tcpip
      - name: build-fetch-localsocket
        run: client/cnano/test-cmake-linux.sh krpc-cnano-*.zip fetch-localsocket

  windows-build-client-cnano-cmake:
    needs: linux-test-client-cnano
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cnano
      - name: vcpkg
        uses: ./.github/actions/vcpkg-windows
        with:
          packages: nanopb:x64-windows
      - name: build-system-serialio
        shell: bash
        run: client/cnano/test-cmake-windows.sh system-serialio
      - name: build-system-tcpip
        shell: bash
        run: client/cnano/test-cmake-windows.sh system-tcpip
      - name: build-system-localsocket
        shell: bash
        run: client/cnano/test-cmake-windows.sh system-localsocket
      - name: build-fetch-serialio
        shell: bash
        run: client/cnano/test-cmake-windows.sh fetch-serialio
      - name: build-fetch-tcpip
        shell: bash
        run: client/cnano/test-cmake-windows.sh fetch-tcpip
      - name: build-fetch-localsocket
        shell: bash
        run: client/cnano/test-cmake-windows.sh fetch-localsocket

  linux-build-client-cnano-vcpkg:
    needs: linux-test-client-cnano
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cnano
      - name: vcpkg
        uses: ./.github/actions/vcpkg-linux
        with:
          packages: nanopb
      - name: test-vcpkg
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: client/cnano/test-vcpkg-linux.sh krpc-cnano-*.zip

  windows-build-client-cnano-vcpkg:
    needs: linux-test-client-cnano
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cnano
      - name: vcpkg
        uses: ./.github/actions/vcpkg-windows
        with:
          packages: nanopb:x64-windows
      - name: test-vcpkg
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache
        run: client/cnano/test-vcpkg-windows.sh

  linux-test-client-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/build-setup
      - name: build
        run: bazel build //client/cpp:cpp
      - name: test
        run: bazel test //client/cpp:test
      - name: upload-artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: client-cpp
          path: bazel-bin/client/cpp/krpc-cpp-*.zip

  linux-build-client-cpp-cmake:
    needs: linux-test-client-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/krpc/buildenv:3.11.0
      options: --user runner:runner
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cpp
      - name: cache-key
        id: cache-key
        run: |
          tmpl=$(sha256sum client/cpp/CMakeLists.txt.tmpl | cut -d' ' -f1)
          cc=$(cc --version 2>/dev/null | head -n1 || echo unknown-cc)
          info=$(printf '%s\n' ccache cpp "$cc" "$tmpl")
          echo 'cache key inputs:'
          printf '%s\n' "$info" | sed 's/^/  /'
          hash=$(printf '%s' "$info" | sha256sum | cut -d' ' -f1)
          echo "cache key: ccache-$hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: ccache-restore
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ steps.cache-key.outputs.hash }}
      - name: build-system
        run: client/cpp/test-cmake-linux.sh krpc-cpp-*.zip system
      - name: build-fetch
        run: client/cpp/test-cmake-linux.sh krpc-cpp-*.zip fetch

  windows-build-client-cpp-cmake:
    needs: linux-test-client-cpp
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cpp
      - name: vcpkg
        uses: ./.github/actions/vcpkg-windows
        with:
          packages: protobuf:x64-windows asio:x64-windows
      - name: test-build
        shell: bash
        run: client/cpp/test-cmake-windows.sh

  linux-build-client-cpp-vcpkg:
    needs: linux-test-client-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cpp
      - name: vcpkg
        uses: ./.github/actions/vcpkg-linux
        with:
          packages: protobuf asio
      - name: test-vcpkg
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: client/cpp/test-vcpkg-linux.sh krpc-cpp-*.zip

  windows-build-client-cpp-vcpkg:
    needs: linux-test-client-cpp
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cpp
      - name: vcpkg
        uses: ./.github/actions/vcpkg-windows
        with:
          packages: protobuf:x64-windows asio:x64-windows
      - name: test-vcpkg
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache
        run: client/cpp/test-vcpkg-windows.sh

  all-checks-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    needs:
      - lint
      - linux
      - windows
      - linux-build-krpc
      - linux-build-genfiles
      - linux-build-csharp-sln
      - windows-build-csharp-sln
      - linux-test-client-cnano
      - linux-build-client-cnano-cmake
      - windows-build-client-cnano-cmake
      - linux-build-client-cnano-vcpkg
      - windows-build-client-cnano-vcpkg
      - linux-test-client-cpp
      - linux-build-client-cpp-cmake
      - windows-build-client-cpp-cmake
      - linux-build-client-cpp-vcpkg
      - windows-build-client-cpp-vcpkg
    steps:
      - name: check
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
