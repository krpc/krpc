      - name: checkout
        uses: actions/checkout@v6
      - name: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: client-cpp
      - name: vcpkg
        uses: ./.github/actions/vcpkg-windows
        with:
          packages: protobuf:x64-windows asio:x64-windows
      - name: test-build
        shell: bash
        run: client/cpp/test-cmake-windows.sh

  linux-build-client-cpp-vcpkg:
