# kRPC for KSA server settings. Read once, when the game starts.

auto_start = true
auto_accept_connections = true

[[servers]]
name = "Default Server"
# ProtocolBuffersOverTCP, ProtocolBuffersOverWebsockets or ProtocolBuffersOverLocalSocket
protocol = "ProtocolBuffersOverTCP"
address = "127.0.0.1"
rpc_port = 50000
stream_port = 50001
