[pytest]
# Separate from the repository's pytest.ini, which configures the KSP tests. The tests run
# with `bazel run //experimental/ksa/tools/game:test-ksa`, which passes this file.

# The documentation examples (doc/test) are marked example, with their language, and slow for
# a long flight, so a run can select them with -m
markers =
    example: a documentation example run in game
    slow: flies a whole tutorial, taking several minutes; skip with -m "not slow"
    python: a Python example
    csharp: a C# example
    cpp: a C++ example
    cnano: a C-nano example
    java: a Java example
    lua: a Lua example
    js: a JavaScript example

# The repository root, from which the examples' tests import their modules and the shared
# tools.doc_examples by fully-qualified name
pythonpath = ../..

# Stream the progress messages of krpctools.game (installing, launching, loading) live
log_cli = true
log_cli_level = INFO
log_cli_format = %(name)s: %(message)s
